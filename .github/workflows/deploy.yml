name: Deploy Databricks Bundle

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI v1.21.0
        run: |
          curl -L "https://github.com/databricks/cli/releases/download/v1.21.0/databricks_cli_1.21.0_linux_amd64.zip" -o /tmp/databricks.zip
          mkdir -p /tmp/databricks-cli
          unzip -q /tmp/databricks.zip -d /tmp/databricks-cli
          chmod +x /tmp/databricks-cli/databricks
          sudo mv /tmp/databricks-cli/databricks /usr/local/bin/databricks
          databricks version

      - name: Validate bundle
        run: |
          databricks bundle validate -t dev

      - name: Deploy bundle
        run: |
          databricks bundle deploy -t dev